<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#ec3d2e" />
  <meta name="description" content="TonMenu — Le goût du quartier. Commandez vos plats préférés à Abidjan, Yopougon et partout en Côte d'Ivoire. Livraison rapide en FCFA." />
  <meta property="og:title" content="TonMenu — Le goût du quartier" />
  <meta property="og:description" content="Commande et livraison de repas en Côte d'Ivoire. Découvrez les meilleurs restaurants autour de vous." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og-image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>TonMenu — Le goût du quartier</title>
  <script>
    // Early device mode redirect to avoid vitrine flash on mobile/tablet
    (function(){
      try{
        var w = window.innerWidth;
        var isCoarse = window.matchMedia('(pointer: coarse)').matches;
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        var isIpad = navigator.userAgent.includes('Macintosh') && navigator.maxTouchPoints > 1;
        var isApp = w < 1024 || isCoarse || isStandalone || isIpad;
        var path = window.location.pathname;
        if(isApp && (path === '/' || path === '/accueil-vitrine')){
          window.location.replace('/accueil');
        }
      }catch(e){}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
