<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#EC3D2E" />

  <meta name="description" content="Les meilleurs restaurants de Yopougon, livrés chez vous. Commandez local avec TonMenu." />
  <meta property="og:title" content="TonMenu — Le goût du quartier." />

  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og-image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    // Redirection mobile/tablette avant rendu (pas de flash)
    (function(){
      try{
        var w = window.innerWidth;
        var isCoarse = window.matchMedia('(pointer: coarse)').matches;
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        var isIpad = navigator.userAgent.includes('Macintosh') && navigator.maxTouchPoints > 1;
        var isApp = w < 1024 || isCoarse || isStandalone || isIpad;
        var path = window.location.pathname;
        var base = (function(){ var m=document.querySelector('base'); return m?m.getAttribute('href'):''; })();
        // Normalize for GitHub Pages base /tonmenu/
        var cleanPath = path.replace(/^\/tonmenu/, '') || '/';
        if(isApp && (cleanPath === '/' || cleanPath === '/accueil-vitrine')){
          var target = (path.indexOf('/tonmenu')===0 ? '/tonmenu/accueil' : '/accueil');
          window.location.replace(target);
        }
      }catch(e){}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
